events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================
    # WordPress
    # =========================
    server {
        listen 80;
        listen 443 ssl;

        server_name myfragrancesparfum.com www.myfragrancesparfum.com;


        client_max_body_size 999M;

        ssl_certificate /etc/letsencrypt/live/myfragrancesparfum.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/myfragrancesparfum.com/privkey.pem;



        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        root /var/www/html;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass wordpress:9000;
        }

    }


    # =========================
    # n8n Service
    # =========================
    server {
        listen 80;
        listen 443 ssl;

        server_name n8n.myfragrancesparfum.com;


        ssl_certificate /etc/letsencrypt/live/myfragrancesparfum.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/myfragrancesparfum.com/privkey.pem;



        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://n8n:5678;
        }
    }


    # =========================
    # Adminer
    # =========================
    server {
        listen 80;
        listen 443 ssl;
        server_name adminer.myfragrancesparfum.com;


        ssl_certificate /etc/letsencrypt/live/myfragrancesparfum.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/myfragrancesparfum.com/privkey.pem;


        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME /var/www/adminer/index.php;
            fastcgi_param SCRIPT_NAME /index.php;

            fastcgi_pass adminer:9000;
        }
    }
}
