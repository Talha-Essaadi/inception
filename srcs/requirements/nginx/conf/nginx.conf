events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================
    # WordPress
    # =========================
    server {
        listen 443 ssl;

        server_name tessaadi.42.fr;

        ssl_certificate /etc/nginx/ssl/tessaadi.42.fr.crt;
        ssl_certificate_key /etc/nginx/ssl/tessaadi.42.fr.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        root /var/www/html;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass wordpress:9000;
        }
    }


    # =========================
    # Static Website
    # =========================
    server {
        listen 443 ssl;

        server_name static.tessaadi.42.fr;

        ssl_certificate /etc/nginx/ssl/tessaadi.42.fr.crt;
        ssl_certificate_key /etc/nginx/ssl/tessaadi.42.fr.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://static-website:80;
        }
    }


    # =========================
    # Usefull Service
    # =========================
    server {
        listen 443 ssl;

        server_name n8n.tessaadi.42.fr;

        ssl_certificate /etc/nginx/ssl/tessaadi.42.fr.crt;
        ssl_certificate_key /etc/nginx/ssl/tessaadi.42.fr.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://n8n:5678;
        }
    }


    # =========================
    # Adminer
    # =========================
    server {
        listen 443 ssl;
        server_name adminer.tessaadi.42.fr;

        ssl_certificate /etc/nginx/ssl/tessaadi.42.fr.crt;
        ssl_certificate_key /etc/nginx/ssl/tessaadi.42.fr.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME /var/www/adminer/index.php;
            fastcgi_param SCRIPT_NAME /index.php;

            fastcgi_pass adminer:9000;
        }
    }
}